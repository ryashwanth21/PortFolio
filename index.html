<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting - Yashwanth R Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 600px;
    }
    h1 {
      font-size: 3rem;
      animation: fadeInDown 1s ease-out;
    }
    p {
      font-size: 1.2rem;
      margin-top: 1rem;
      animation: fadeIn 2s ease-in;
    }
    .btn {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.8rem 1.5rem;
      background-color: white;
      color: #2a5298;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      transition: 0.3s ease;
    }
    .btn:hover {
      background-color: #e0e0e0;
    }
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>
  <script>
    setTimeout(() => {
      window.location.href = "https://xvytvcze.manus.space/";
    }, 5000); // Redirect after 5 seconds
  </script>
</head>
<body>
  <div class="container">
    <h1>Welcome to Yashwanth R's Portfolio</h1>
    <p>Redirecting you to the full portfolio...</p>
    <a href="https://xvytvcze.manus.space/" class="btn">Click here if not redirected</a>
  </div>
</body>
</html>
